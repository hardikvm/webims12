<div class="container-fluid vh-100 d-flex justify-content-center align-items-center" style="background: url('https://via.placeholder.com/1920x1080') no-repeat center center/cover;">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px; border-radius: 15px; background: rgba(255, 255, 255, 0.9);">
        <h2 class="text-center mb-4" style="color: #007bff;">Travel Booking</h2>
        <form #signup="ngForm">
            <div class="mb-3"  *ngIf="!isLogin">
                
                <label for="exampleInputEmail1" class="form-label">
                     Employee Name    
                   </label>
                <div class="input-group">
                    <!-- <span class="input-group-text"><i class="fas fa-envelope"></i></span> -->
                    <input type="text" class="form-control"  aria-describedby="emailHelp" placeholder="Enter your name"   name="empName" [(ngModel)]="empName">
                </div>
            </div>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">                   
                    Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter your email" name="email" [(ngModel)]="email">
                </div>
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Enter your password" name="password" [(ngModel)]="password">
                </div>
            </div>
            <div *ngIf="!isLogin">
                <button type="submit" class="btn btn-primary w-100" (click)="createAccount()" >Create Account</button>
                <div class="mt-3 text-center">
                    <a class="setUrl text-primary" style="cursor: pointer;" (click)="haveacc(true)">Already have an account? Login</a>
                </div>
            </div>
            <div class="input" *ngIf="iserror">
                please input correct email and password
            </div>
            <div *ngIf="isLogin">
                <button type="submit" class="btn btn-primary w-100" (click)="login()">Login</button>
                <div class="mt-3 text-center">
                    <a class="setUrl text-primary" style="cursor: pointer;" (click)="haveacc(false)">Create a new account</a>
                </div>
            </div>
        </form>
    </div>
</div>
