<app-navbar></app-navbar>
<div class="container">
    <div class="flex my-2">
        <h4 Class="yrrbk">
            Your Bookings
        </h4>
        <div class="add">
            <!-- data-bs-toggle="modal" data-bs-target="#exampleModal"> -->
            <button class="btn btn-outline-success mx-2" type="submit"   (click)="addVisit()">Add Visit</button>  
            <!-- <button class="btn btn-outline-success mx-2" type="submit" (click)="addVisit()">Add Visit</button>   -->
        </div>
    </div>
</div>
<div class="bookinglist">
    <table mat-table [dataSource]="dataSource">

        <!-- Position Column -->
        <!-- <ng-container matColumnDef="position">
          <th mat-header-cell *matHeaderCellDef> No. </th>
          <td mat-cell *matCellDef="let element"> {{element.position}} </td>
        </ng-container> -->
    
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>
    
        <!-- Weight Column -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef> Description  </th>
          <td mat-cell *matCellDef="let element"> {{element.description}} </td>
        </ng-container>
    
        <!-- Symbol Column -->
        <ng-container matColumnDef="daterange">
          <th mat-header-cell *matHeaderCellDef> Date Range </th>
          <td mat-cell *matCellDef="let element"> {{ element.dateFrom|date }} ~ {{element.dateTo|date}}
        </ng-container>

        <ng-container matColumnDef="jobType">
          <th mat-header-cell *matHeaderCellDef> Visit Type
          <td mat-cell *matCellDef="let element"> {{ element.jobType}} 
        </ng-container>
    
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    
      <mat-paginator [pageSizeOptions]="[5, 10, 20]"  [length]="datalength" [pageSize]="10"
                     showFirstLastButtons  (page)="onPageChange($event)"
                     aria-label="Select page of periodic elements">
      </mat-paginator>
</div>
